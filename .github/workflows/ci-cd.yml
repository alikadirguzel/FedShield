name: FedShield CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard against local paths and committed secrets
        run: |
          set -euo pipefail
          if git grep -nE 'C:\\Users\\|/Users/[^/]+/|/home/[^/]+/' -- src config docker scripts tests README.md Makefile dev.ps1 SECURITY.md; then
            echo "Refusing to ship machine-local paths"
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|\.key$|vault-keys\.json$'; then
            echo "Refusing to ship secret files"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check src tests scripts

      - name: Generate Non-IID data
        run: python scripts/generate_non_iid_data.py

      - name: Unit tests
        run: pytest tests/unit -q --cov=src --cov-report=term-missing

      - name: Integration tests
        run: pytest tests/integration -q
        env:
          FEDSHIELD_DEV_CERTS: "true"

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    env:
      MLFLOW_TRACKING_PASSWORD: ci-not-a-secret
      MLFLOW_BIND: 127.0.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose file
        run: docker compose config --quiet

      - name: Build images
        run: |
          docker build -f docker/Dockerfile.server -t fedshield-server:ci .
          docker build -f docker/Dockerfile.client -t fedshield-client:ci .
          docker build -f docker/Dockerfile.data -t fedshield-data:ci .
          docker build -f docker/Dockerfile.vault -t fedshield-vault-init:ci .
          docker build -f docker/Dockerfile.vault-server -t fedshield-vault:ci .
          docker build -f docker/Dockerfile.mlflow -t fedshield-mlflow:ci .
