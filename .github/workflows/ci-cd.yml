name: FedShield CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check src tests scripts

      - name: Generate Non-IID data
        run: python scripts/generate_non_iid_data.py

      - name: Unit tests
        run: pytest tests/unit -q --cov=src --cov-report=term-missing

      - name: Integration tests
        run: pytest tests/integration -q
        env:
          FEDSHIELD_DEV_CERTS: "true"

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose file
        run: docker compose config --quiet

      - name: Build server image
        run: docker build -f docker/Dockerfile.server -t fedshield-server:ci .

      - name: Build client image
        run: docker build -f docker/Dockerfile.client -t fedshield-client:ci .

      - name: Build vault-init image
        run: docker build -f docker/Dockerfile.vault -t fedshield-vault-init:ci .

      - name: Build MLflow image
        run: docker build -f docker/Dockerfile.mlflow -t fedshield-mlflow:ci .
