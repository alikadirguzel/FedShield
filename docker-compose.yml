# FedShield — portable Compose stack (no host home paths, no baked-in secrets)
#
# Networks:
#   pki-plane     — Vault + vault-init only (internal)
#   control-plane — MLflow + Flower server
#   fl-fabric     — Flower server + clients, mTLS gRPC only (internal)
#
# Required: copy .env.example → .env (scripts/init_env.py) and set a password.
name: fedshield

x-client-common: &client-common
  build:
    context: .
    dockerfile: docker/Dockerfile.client
  depends_on:
    data-init:
      condition: service_completed_successfully
    vault-init:
      condition: service_completed_successfully
    server:
      condition: service_started
  environment:
    SERVER_ADDRESS: server:8080
    PRIVACY_CONFIG: /app/config/privacy_config.yaml
    CERT_DIR: /certs
    DATA_DIR: /data/processed
    FEDSHIELD_DEV_CERTS: "false"
    PYTHONPATH: /app
    GRPC_MAX_MESSAGE_LENGTH: "33554432"
  networks:
    - fl-fabric
  restart: on-failure

services:
  data-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.data
    container_name: fedshield-data-init
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - data-alpha:/out/client-alpha
      - data-beta:/out/client-beta
      - data-gamma:/out/client-gamma
    command: ["--isolated-root", "/out"]
    restart: "no"

  vault:
    build:
      context: .
      dockerfile: docker/Dockerfile.vault-server
    container_name: fedshield-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - vault-data:/vault/file
    networks:
      - pki-plane
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 8s

  vault-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.vault
    container_name: fedshield-vault-init
    depends_on:
      vault:
        condition: service_started
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_INIT_DIR: /vault-init
      CERT_DIR: /certs
    volumes:
      - vault-init-keys:/vault-init
      - certs-server:/certs/server
      - certs-alpha:/certs/client-alpha
      - certs-beta:/certs/client-beta
      - certs-gamma:/certs/client-gamma
    networks:
      - pki-plane
    restart: "no"

  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    container_name: fedshield-mlflow
    environment:
      MLFLOW_TRACKING_USERNAME: ${MLFLOW_TRACKING_USERNAME:-fedshield}
      MLFLOW_TRACKING_PASSWORD: "${MLFLOW_TRACKING_PASSWORD:?Set MLFLOW_TRACKING_PASSWORD in .env}"
      _MLFLOW_SERVER_FILE_STORE: sqlite:////mlflow/mlflow.db
      _MLFLOW_SERVER_ARTIFACT_ROOT: /mlflow/artifacts
      _MLFLOW_SERVER_SERVE_ARTIFACTS: "true"
    ports:
      - "${MLFLOW_BIND:-127.0.0.1}:${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow-data:/mlflow
    networks:
      - control-plane
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os,base64,urllib.request; u=os.environ['MLFLOW_TRACKING_USERNAME']; p=os.environ['MLFLOW_TRACKING_PASSWORD']; r=urllib.request.Request('http://127.0.0.1:5000/'); r.add_header('Authorization','Basic '+base64.b64encode(f'{u}:{p}'.encode()).decode()); urllib.request.urlopen(r, timeout=4)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: fedshield-server
    depends_on:
      vault-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_TRACKING_USERNAME: ${MLFLOW_TRACKING_USERNAME:-fedshield}
      MLFLOW_TRACKING_PASSWORD: "${MLFLOW_TRACKING_PASSWORD:?Set MLFLOW_TRACKING_PASSWORD in .env}"
      SERVER_CONFIG: /app/config/server_config.yaml
      PRIVACY_CONFIG: /app/config/privacy_config.yaml
      CERT_DIR: /certs
      FEDSHIELD_DEV_CERTS: "false"
      PYTHONPATH: /app
      FEDSHIELD_SERVICE: server
      GIT_PYTHON_REFRESH: quiet
      GRPC_MAX_MESSAGE_LENGTH: "33554432"
    volumes:
      - certs-server:/certs:ro
    networks:
      - fl-fabric
      - control-plane
    restart: on-failure

  client-alpha:
    <<: *client-common
    container_name: fedshield-client-alpha
    environment:
      CLIENT_ID: client-alpha
      SERVER_ADDRESS: server:8080
      PRIVACY_CONFIG: /app/config/privacy_config.yaml
      CERT_DIR: /certs
      DATA_DIR: /data/processed
      FEDSHIELD_DEV_CERTS: "false"
      PYTHONPATH: /app
      FEDSHIELD_SERVICE: client-alpha
      GRPC_MAX_MESSAGE_LENGTH: "33554432"
    volumes:
      - certs-alpha:/certs:ro
      - data-alpha:/data/processed:ro

  client-beta:
    <<: *client-common
    container_name: fedshield-client-beta
    environment:
      CLIENT_ID: client-beta
      SERVER_ADDRESS: server:8080
      PRIVACY_CONFIG: /app/config/privacy_config.yaml
      CERT_DIR: /certs
      DATA_DIR: /data/processed
      FEDSHIELD_DEV_CERTS: "false"
      PYTHONPATH: /app
      FEDSHIELD_SERVICE: client-beta
      GRPC_MAX_MESSAGE_LENGTH: "33554432"
    volumes:
      - certs-beta:/certs:ro
      - data-beta:/data/processed:ro

  client-gamma:
    <<: *client-common
    container_name: fedshield-client-gamma
    environment:
      CLIENT_ID: client-gamma
      SERVER_ADDRESS: server:8080
      PRIVACY_CONFIG: /app/config/privacy_config.yaml
      CERT_DIR: /certs
      DATA_DIR: /data/processed
      FEDSHIELD_DEV_CERTS: "false"
      PYTHONPATH: /app
      FEDSHIELD_SERVICE: client-gamma
      GRPC_MAX_MESSAGE_LENGTH: "33554432"
    volumes:
      - certs-gamma:/certs:ro
      - data-gamma:/data/processed:ro

networks:
  pki-plane:
    driver: bridge
    internal: true
  control-plane:
    driver: bridge
    internal: false
  fl-fabric:
    driver: bridge
    internal: true

volumes:
  vault-data:
  vault-init-keys:
  certs-server:
  certs-alpha:
  certs-beta:
  certs-gamma:
  data-alpha:
  data-beta:
  data-gamma:
  mlflow-data:
