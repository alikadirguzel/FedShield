# FedShield — 5-hospital demo
#
# Networks:
#   pki-plane       — Vault + vault-init only (internal)
#   control-plane   — MLflow + Flower server + demo console
#   fl-hospital-*   — one internal network per hospital (server + that client only)
#
# Required: python scripts/init_env.py then docker compose up -d --build
name: fedshield

x-client-common: &client-common
  build:
    context: .
    dockerfile: docker/Dockerfile.client
  depends_on:
    data-init:
      condition: service_completed_successfully
    vault-init:
      condition: service_completed_successfully
    server:
      condition: service_started
  restart: on-failure

services:
  data-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.data
    container_name: fedshield-data-init
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data/hospitals/hospital-a:/out/hospital-a
      - ./data/hospitals/hospital-b:/out/hospital-b
      - ./data/hospitals/hospital-c:/out/hospital-c
      - ./data/hospitals/hospital-d:/out/hospital-d
      - ./data/hospitals/hospital-e:/out/hospital-e
    command:
      [
        "--isolated-root", "/out",
        "--num-clients", "5",
        "--client-ids",
        "hospital-a", "hospital-b", "hospital-c", "hospital-d", "hospital-e",
        "--profile", "hospitals",
        "--n-samples", "8000",
      ]
    restart: "no"

  vault:
    build:
      context: .
      dockerfile: docker/Dockerfile.vault-server
    container_name: fedshield-vault
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      SKIP_SETCAP: "true"
    command: ["server"]
    volumes:
      - vault-data:/vault/file
    networks:
      - pki-plane
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 8s

  vault-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.vault
    container_name: fedshield-vault-init
    depends_on:
      vault:
        condition: service_started
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_INIT_DIR: /vault-init
      CERT_DIR: /certs
    volumes:
      - vault-init-keys:/vault-init
      - certs-server:/certs/server
      - certs-hospital-a:/certs/hospital-a
      - certs-hospital-b:/certs/hospital-b
      - certs-hospital-c:/certs/hospital-c
      - certs-hospital-d:/certs/hospital-d
      - certs-hospital-e:/certs/hospital-e
    networks:
      - pki-plane
    restart: "no"

  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    container_name: fedshield-mlflow
    environment:
      MLFLOW_TRACKING_USERNAME: ${MLFLOW_TRACKING_USERNAME:-fedshield}
      MLFLOW_TRACKING_PASSWORD: "${MLFLOW_TRACKING_PASSWORD:?Set MLFLOW_TRACKING_PASSWORD in .env}"
      _MLFLOW_SERVER_FILE_STORE: sqlite:////mlflow/mlflow.db
      _MLFLOW_SERVER_ARTIFACT_ROOT: /mlflow/artifacts
      _MLFLOW_SERVER_SERVE_ARTIFACTS: "true"
    ports:
      - "${MLFLOW_BIND:-127.0.0.1}:${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow-data:/mlflow
    networks:
      - control-plane
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os,base64,urllib.request; u=os.environ['MLFLOW_TRACKING_USERNAME']; p=os.environ['MLFLOW_TRACKING_PASSWORD']; r=urllib.request.Request('http://127.0.0.1:5000/'); r.add_header('Authorization','Basic '+base64.b64encode(f'{u}:{p}'.encode()).decode()); urllib.request.urlopen(r, timeout=4)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: fedshield-server
    depends_on:
      vault-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_TRACKING_USERNAME: ${MLFLOW_TRACKING_USERNAME:-fedshield}
      MLFLOW_TRACKING_PASSWORD: "${MLFLOW_TRACKING_PASSWORD:?Set MLFLOW_TRACKING_PASSWORD in .env}"
      SERVER_CONFIG: /app/config/server_config.yaml
      PRIVACY_CONFIG: /app/config/privacy_config.yaml
      CERT_DIR: /certs
      FEDSHIELD_DEV_CERTS: "false"
      PYTHONPATH: /app
      FEDSHIELD_SERVICE: server
      GIT_PYTHON_REFRESH: quiet
      GRPC_MAX_MESSAGE_LENGTH: "33554432"
    volumes:
      - certs-server:/certs:ro
    networks:
      - control-plane
      - fl-hospital-a
      - fl-hospital-b
      - fl-hospital-c
      - fl-hospital-d
      - fl-hospital-e
    restart: on-failure

  hospital-a:
    <<: *client-common
    container_name: fedshield-hospital-a
    environment:
      CLIENT_ID: hospital-a
      SERVER_ADDRESS: server:8080
      PRIVACY_CONFIG: /app/config/privacy_config.yaml
      CERT_DIR: /certs
      DATA_DIR: /data/processed
      FEDSHIELD_DEV_CERTS: "false"
      PYTHONPATH: /app
      FEDSHIELD_SERVICE: hospital-a
      GRPC_MAX_MESSAGE_LENGTH: "33554432"
    volumes:
      - certs-hospital-a:/certs:ro
      - ./data/hospitals/hospital-a:/data/processed:ro
    networks:
      - fl-hospital-a

  hospital-b:
    <<: *client-common
    container_name: fedshield-hospital-b
    environment:
      CLIENT_ID: hospital-b
      SERVER_ADDRESS: server:8080
      PRIVACY_CONFIG: /app/config/privacy_config.yaml
      CERT_DIR: /certs
      DATA_DIR: /data/processed
      FEDSHIELD_DEV_CERTS: "false"
      PYTHONPATH: /app
      FEDSHIELD_SERVICE: hospital-b
      GRPC_MAX_MESSAGE_LENGTH: "33554432"
    volumes:
      - certs-hospital-b:/certs:ro
      - ./data/hospitals/hospital-b:/data/processed:ro
    networks:
      - fl-hospital-b

  hospital-c:
    <<: *client-common
    container_name: fedshield-hospital-c
    environment:
      CLIENT_ID: hospital-c
      SERVER_ADDRESS: server:8080
      PRIVACY_CONFIG: /app/config/privacy_config.yaml
      CERT_DIR: /certs
      DATA_DIR: /data/processed
      FEDSHIELD_DEV_CERTS: "false"
      PYTHONPATH: /app
      FEDSHIELD_SERVICE: hospital-c
      GRPC_MAX_MESSAGE_LENGTH: "33554432"
    volumes:
      - certs-hospital-c:/certs:ro
      - ./data/hospitals/hospital-c:/data/processed:ro
    networks:
      - fl-hospital-c

  hospital-d:
    <<: *client-common
    container_name: fedshield-hospital-d
    environment:
      CLIENT_ID: hospital-d
      SERVER_ADDRESS: server:8080
      PRIVACY_CONFIG: /app/config/privacy_config.yaml
      CERT_DIR: /certs
      DATA_DIR: /data/processed
      FEDSHIELD_DEV_CERTS: "false"
      PYTHONPATH: /app
      FEDSHIELD_SERVICE: hospital-d
      GRPC_MAX_MESSAGE_LENGTH: "33554432"
    volumes:
      - certs-hospital-d:/certs:ro
      - ./data/hospitals/hospital-d:/data/processed:ro
    networks:
      - fl-hospital-d

  hospital-e:
    <<: *client-common
    container_name: fedshield-hospital-e
    environment:
      CLIENT_ID: hospital-e
      SERVER_ADDRESS: server:8080
      PRIVACY_CONFIG: /app/config/privacy_config.yaml
      CERT_DIR: /certs
      DATA_DIR: /data/processed
      FEDSHIELD_DEV_CERTS: "false"
      PYTHONPATH: /app
      FEDSHIELD_SERVICE: hospital-e
      GRPC_MAX_MESSAGE_LENGTH: "33554432"
    volumes:
      - certs-hospital-e:/certs:ro
      - ./data/hospitals/hospital-e:/data/processed:ro
    networks:
      - fl-hospital-e

  console:
    build:
      context: .
      dockerfile: docker/Dockerfile.console
    container_name: fedshield-console
    environment:
      PYTHONUNBUFFERED: "1"
      HOSPITALS_ROOT: /data/hospitals
      MLFLOW_PUBLIC_URL: http://127.0.0.1:5000
    ports:
      - "127.0.0.1:8500:8500"
    volumes:
      - ./data/hospitals:/data/hospitals
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - control-plane
    restart: on-failure

networks:
  pki-plane:
    driver: bridge
    internal: true
  control-plane:
    driver: bridge
    internal: false
  fl-hospital-a:
    driver: bridge
    internal: true
  fl-hospital-b:
    driver: bridge
    internal: true
  fl-hospital-c:
    driver: bridge
    internal: true
  fl-hospital-d:
    driver: bridge
    internal: true
  fl-hospital-e:
    driver: bridge
    internal: true

volumes:
  vault-data:
  vault-init-keys:
  certs-server:
  certs-hospital-a:
  certs-hospital-b:
  certs-hospital-c:
  certs-hospital-d:
  certs-hospital-e:
  mlflow-data:
