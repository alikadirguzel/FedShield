# data_isolation: raw data never leaves the client; SecAgg hides individual updates.
#   No DP noise — this is the default for the 5-hospital utility demo.
# dp_sgd: also add Opacus Gaussian noise (hurts accuracy; enable when a regulator asks for ε).
privacy:
  mode: data_isolation

differential_privacy:
  enabled: false
  target_epsilon: 5.0
  epsilon_max: 8.0
  target_delta: 1.0e-5
  calibrate_to_target: true
  noise_multiplier: 1.1
  max_grad_norm: 1.0
  poisson_sampling: true

training:
  local_epochs: 3
  batch_size: 64
  learning_rate: 0.05

federated:
  num_rounds: 10

aggregation:
  mode: secagg
  max_update_norm: 5.0
  trim_beta: 0.2
  num_malicious_clients: 0
  krum_to_keep: 0

client:
  client_id: "client-default"
  data_dir: "/data/processed"
  num_classes: 10
  input_dim: 784

logging:
  level: "INFO"
  json: true
